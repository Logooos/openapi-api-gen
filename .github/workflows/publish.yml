name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Ensure npm supports OIDC
        run: |
          npm install --global npm@11 --registry=https://registry.npmjs.org/
          npm --version
          node -e "const [major, minor, patch] = require('node:child_process').execSync('npm --version', { encoding: 'utf8' }).trim().split('.').map(Number); require('node:assert/strict').ok(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'npm >=11.5.1 is required');"
      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag', 'Release requires a tag');
          assert.match(process.env.GITHUB_REF_NAME ?? '', /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/, 'Tag must be v<semver>');
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Tag must match package.json version');
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm pack --dry-run --registry=https://registry.npmjs.org/
      - name: Publish to npm with OIDC
        env:
          NPM_CONFIG_FETCH_RETRIES: "0"
          NPM_CONFIG_FETCH_TIMEOUT: "15000"
          NPM_CONFIG_PREFER_ONLINE: "true"
        run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken
          npm config set registry https://registry.npmjs.org/
          expected=$(node -p "require('./package.json').version")
          errors=$(mktemp)
          trap 'rm -f "$errors"' EXIT
          if actual=$(npm view "openapi-api-gen@${expected}" version --registry=https://registry.npmjs.org/ 2>"$errors"); then
            if [ "$actual" = "$expected" ]; then
              echo "openapi-api-gen@${expected} already exists; skipping npm publish"
              exit 0
            fi
            echo "Unexpected registry version: $actual (expected $expected)" >&2
            exit 1
          elif ! grep -Eq '^(npm error|npm ERR!) code E404$' "$errors"; then
            cat "$errors" >&2
            echo "Cannot determine whether openapi-api-gen@${expected} exists" >&2
            exit 1
          fi
          echo "openapi-api-gen@${expected} does not exist; publishing"
          npm publish --access public --provenance --registry=https://registry.npmjs.org/
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify published version
        env:
          NPM_CONFIG_FETCH_RETRIES: "0"
          NPM_CONFIG_FETCH_TIMEOUT: "15000"
          NPM_CONFIG_PREFER_ONLINE: "true"
        run: |
          expected=$(node -p "require('./package.json').version")
          for attempt in {1..15}; do
            actual=$(npm view "openapi-api-gen@${expected}" version --registry=https://registry.npmjs.org/ 2>/dev/null) || actual=""
            if [ "$actual" = "$expected" ]; then
              echo "Verified openapi-api-gen@$actual"
              npm view openapi-api-gen dist-tags --registry=https://registry.npmjs.org/ || echo "Could not observe dist-tags; exact version is verified"
              exit 0
            fi
            echo "Attempt $attempt/15: openapi-api-gen@${expected} is not available yet"
            if [ "$attempt" -lt 15 ]; then sleep 120; fi
          done
          echo "Official registry did not report openapi-api-gen@${expected} after 15 attempts / approximately 30 minutes." >&2
          exit 1
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            echo "Release $GITHUB_REF_NAME already exists; skipping creation"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
