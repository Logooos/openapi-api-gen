name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - name: Verify release tag
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag', 'Release requires a tag');
          assert.equal(process.env.GITHUB_REF_NAME, `v${version}`, 'Tag must match package.json version');
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: npm pack --dry-run --registry=https://registry.npmjs.org/
      - name: Publish to npm with OIDC
        run: npm publish --access public --registry=https://registry.npmjs.org/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
