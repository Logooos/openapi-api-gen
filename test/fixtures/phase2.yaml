openapi: 3.0.3
info: { title: Phase 2, version: "1" }
paths:
  /records/{id}/{slot}:
    parameters:
      - {
          name: id,
          in: path,
          required: true,
          schema: { type: integer, format: int64 },
        }
      - { name: slot, in: path, required: true, schema: { type: string } }
    post:
      operationId: save_record_1
      tags: [records, ignored]
      summary: 保存记录
      description: 保留后端后缀
      parameters:
        - {
            name: q,
            in: query,
            description: 过滤条件,
            schema: { type: string },
          }
        - {
            name: Authorization,
            in: header,
            required: true,
            schema: { type: string },
          }
        - {
            name: X-Tenant,
            in: header,
            required: true,
            schema: { type: string },
          }
      requestBody:
        required: true
        description: 记录数据
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordDTO" }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                application/json:
                  { schema: { $ref: "#/components/schemas/RecordVO" } },
              },
          }
        "201":
          {
            description: Created,
            content:
              { "*/*": { schema: { $ref: "#/components/schemas/RecordVO" } } },
          }
        "204": { description: Empty }
        "400":
          {
            description: Error,
            content: { application/json: { schema: { type: string } } },
          }
    delete:
      operationId: remove_2
      tags: [records]
      responses:
        "204": { description: Done }
  /records:
    get:
      operationId: getPage
      tags: [records]
      parameters:
        - { name: page, in: query, required: true, schema: { type: integer } }
        - {
            name: order,
            in: query,
            schema: { type: string, enum: [ASC, DESC] },
          }
      responses:
        "200":
          {
            description: OK,
            content:
              {
                "*/*":
                  {
                    schema:
                      {
                        type: array,
                        items: { $ref: "#/components/schemas/RecordVO" },
                      },
                  },
              },
          }
    put:
      operationId: update
      tags: [records]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordDTO" }
      responses:
        "200":
          {
            description: OK,
            content: { application/json: { schema: { type: boolean } } },
          }
    patch:
      operationId: patch
      tags: [records]
      responses:
        "204": { description: OK }
  /binary:
    get:
      operationId: binary
      tags: [records]
      responses:
        "200":
          {
            description: Bytes,
            content: { "*/*": { schema: { type: string, format: binary } } },
          }
components:
  schemas:
    RecordDTO:
      type: object
      required: [name, mode]
      description: 请求 DTO
      properties:
        name: { type: string, description: "名字 */ 不得注入代码" }
        mode: { type: string, x-enum-name: Mode, enum: ["1:启用(Enabled)"] }
        count: { type: integer, format: int64 }
        when: { type: string, format: date-time }
        optional: { type: string, nullable: true }
        status: { type: string, enum: [READY, FAILED] }
        map: { type: object, additionalProperties: { type: number } }
        choice: { oneOf: [{ type: string }, { type: integer }] }
        either: { anyOf: [{ type: string }, { type: boolean }] }
        json: { $ref: "#/components/schemas/JsonNode" }
    RecordVO:
      allOf:
        - { $ref: "#/components/schemas/RecordDTO" }
        - type: object
          required: [id]
          properties:
            id: { type: integer, format: int64, readOnly: true }
            children:
              { type: array, items: { $ref: "#/components/schemas/RecordVO" } }
    JsonNode: { type: object }
